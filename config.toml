[params.datapro]
# 数据处理参数 Data Processing Parameters
startWinLen = 3                      # 起始窗长
startPoint = 0                       # 起始点
endWinLen = 0                        # 终止窗长
endPoint = 0                         # 终止点
noiseVar = 0                         # 噪声方差
trackDisLower = 0                    # 航迹距离下限
trackDisUpper = 0                    # 航迹距离上限
trackAziThresh = 0                   # 航迹方位门限
trackEleThresh = 0                   # 航迹俯仰门限
trackVelThresh = 0                   # 航迹速度门限
trackStatThresh = 0                  # 航迹统计门限
accuDisGate = 0                      # 累积距离门
accuAziGate = 0                      # 累积方位门
accuEleGate = 0                      # 累积俯仰门
accuVelGate = 0                      # 累积速度门

[params.datasave]
# 数据保存参数 Data Save Parameters
saveSwitch = 0                       # 保存开关
dataID = 0                           # 数据ID

# =============================================================================
# OSM道路数据配置 OSM Road Data Configuration
# =============================================================================

[osm]
# OSM道路数据文件（放在osm/目录下，仅文件名）
file = "bailuyuan.osm"
# 启用WGS84→GCJ-02坐标转换（中国地图瓦片必须开启，否则道路与地图有~300m偏移）
gcj02 = true
# 道路插值步长（米），在相邻OSM节点间均匀插入加密点，0=不插值
interpolation_step = 30

# =============================================================================
# 显示配置 Display Configuration
# =============================================================================

[displayConfig]
# 检测点显示配置 Detection Point Display Configuration
max_points = 1000                    # 最大检测点数量
max_track_points = 200               # 单批航迹最大点数
# P显和阵面开启控制的初始阵面数量（1~4，默认仅阵面1；不自动下发阵面开关命令）
default_panel_count = 1
iftbd = true                        # 是否启用TBD航迹接收与显示
ifxietong = true                    # 是否启用协同航迹接收与显示
sector_display_enabled = false       # Create the sector display widget
sector_display_data_enabled = false  # Feed live points/tracks into sector display; keep false for benchmark
track_label_refresh_ms = 200         # 主P显航迹标签最小刷新间隔，0=每点刷新
chart_track_labels_enabled = false   # B显/高显是否显示航迹批号标签，压测建议关闭
chart_track_label_refresh_ms = 200   # B显/高显航迹标签最小刷新间隔，0=每点刷新
send_road_points_to_datapro = false  # 是否向数处下发道路点，压测建议关闭
