# =============================================================================
# 雷达系统配置文件 Radar System Configuration
# =============================================================================

# =============================================================================
# 网络通信配置 Network Communication Configuration
# =============================================================================

[network.ips]
# IP地址配置（与config.json保持一致）
DISP_CTRL_IP = "192.168.64.4"        # 显控主机IP地址
DATA_PRO_IP = "192.168.64.3"         # 数据处理主机IP地址
SIG_PRO_IP = "192.168.64.3"          # 信号处理主机IP地址
RES_DIS_IP = "192.168.64.3"          # 资源分配主机IP地址
PHOTO_ELE_IP = "192.168.101.10"      # 光电主机IP地址
MONITOR_IP = "192.168.64.3"          # 监控主机IP地址
DISP_CTRL_IP_FOR_PHOTO = "192.168.101.14"  # 显控对光电IP地址
GCS_LOCAL_IP = "192.168.144.66"      # 雷达平台GCS链路本机IP地址
GCS_IP = "192.168.144.77"            # GCS地面站IP地址

[network.ports]
# 端口配置（与config.json保持一致）
DISP_2_RES_PORT = 6012               # 显控->资源分配端口
RES_GET_DISP_PORT = 8012             # 资源分配接收显控端口
DISP_2_SIG_PORT = 6002               # 显控->信号处理端口
SIG_GET_DISP_PORT = 8002             # 信号处理接收显控端口
SIG_2_DISP_PORT1 = 6003              # 信号处理->显控端口1
SIG_2_DISP_PORT2 = 6004              # 信号处理->显控端口2
DISP_GET_SIG_PORT1 = 8003            # 显控接收信号端口1
DISP_GET_SIG_PORT2 = 8004            # 显控接收信号端口2
DATA_PRO_2_DISP = 6006               # 数据处理->显控：常规航迹发送端口（0xEE01）
DISP_GET_DATA_PORT = 8006            # 显控接收常规航迹端口（0xEE01）
DISP_2_DATA = 6008                   # 显控->数据处理端口
DATA_GET_DISP = 8008                 # 数据处理接收显控端口
DATA_PRO_2_DISP2 = 6010              # 数据处理->显控：TBD航迹发送端口（0xEE02）
DISP_GET_DATA_PORT2 = 8010           # 显控接收TBD航迹端口（0xEE02）
DATA_PRO_2_DISP3 = 6020              # 数据处理->显控：协同航迹发送端口（0xEE03）
DISP_GET_DATA_PORT3 = 8020           # 显控接收协同航迹端口（0xEE03）
TARGET_2_DISP = 6017                 # 目标分类->显控端口
DISP_GET_TARGET_PORT = 8017          # 显控接收目标端口
DISP_2_MONITOR = 6018                # 显控->监控端口
MONITOR_GET_DISP_PORT = 8018         # 监控接收显控端口
MONITOR_2_DISP = 6019                # 监控->显控端口
DISP_GET_MONITOR_PORT = 8019         # 显控接收监控端口
DISP_2_PHOTO_PORT = 10100            # 显控->光电端口
PHOTO_GET_DISP_PORT = 21001          # 光电接收显控端口
GCS_DST_PORT = 19801                 # GCS接收目标下发端口（雷达→GCS）
GCS_SRC_PORT = 19800                 # 本地雷达GCS链路端口

[network.ids]
# 系统ID配置（与config.json保持一致）
RES_DIS_ID = 47873                   # 资源分配系统ID
SIG_PRO_ID = 47874                   # 信号处理系统ID
DATA_PRO_ID = 47875                  # 数据处理系统ID
DISP_CTRL_ID = 47876                 # 显示控制系统ID
TAR_CLA_ID = 47877                   # 目标分类系统ID
MONITOR_ID = 47878                   # 监控系统ID

# =============================================================================
# 雷达系统参数配置 Radar System Parameters Configuration
# =============================================================================

[radar]
# 雷达位置配置（基于index.html中的默认值）
longitude = 109.123922221                 # 雷达中心经度（西电99号楼）
latitude = 34.225249343                   # 雷达中心纬度（西电99号楼）
altitude = 781.48                     # 雷达海拔高度（米）
azimuth = 0.0                        # 阵面指北角（度）
pitch = 15.0                         # 俯仰角/倾角（度）
roll = 0.0                           # 横滚角（度）

[polarDisp.range]
# 极坐标显示距离范围配置（与config.json保持一致）
min = 0                              # 最小显示距离（千米）
max = 5                              # 最大显示距离（千米）

# =============================================================================
# 地图显示配置 Map Display Configuration
# =============================================================================

[map]
# 地图基本配置
engine = 1                           # 地图引擎：0=OSM(MapLibre+PMTiles,WGS84), 1=高德(AMap,GCJ-02)
default_type = 1                     # 默认地图类型（各引擎类型不同，详见下方说明）
# OSM引擎类型: 0=无地图, 1=路网图, 2=雷达暗绿, 3=暗色标准, 4=全要素
# 高德引擎类型: 0=无地图, 1=路网图, 2=标准图, 3=卫星图

# =============================================================================
# 扇形显示配置 Sector Display Configuration
# =============================================================================

[sectorDisp.angle]
# 扇形角度范围配置（单位：度）
min = -30                            # 默认最小角度
max = 30                             # 默认最大角度

[sectorDisp.range]
# 扇形距离范围配置（单位：公里）
min = 0                              # 默认最小距离
max = 5                              # 默认最大距离（与全局最大距离一致）

# =============================================================================
# 雷达扫描角度范围配置 Radar Scan Angle Range Configuration
# =============================================================================

[polarDisp.azimuthRange]
# 方位角范围配置（单位：度）
min = 30                             # 默认最小方位角
max = 120                            # 默认最大方位角

[polarDisp.elevationRange]
# 俯仰角范围配置（单位：度）
min = -10                            # 默认最小俯仰角
max = 45                             # 默认最大俯仰角

# =============================================================================
# 系统运行配置 System Runtime Configuration
# =============================================================================

[system]
# 系统运行参数
log_level = "INFO"                   # 日志级别：DEBUG/INFO/WARNING/ERROR
auto_save_interval = 300             # 自动保存间隔（秒）
enable_photoelectric_tx = false      # 是否启用显控->光电发送（临时不用时建议关闭）
enable_photoelectric_heartbeat = false # 是否启用光电心跳发送

[webengine]
# WebEngine调试配置
enable_debug = true                  # 是否启用WebEngine远程调试
debug_port = 9222                    # 调试端口

# =============================================================================
# 参数配置（运行时保存） Parameter Configuration (Runtime Save)
# =============================================================================

[params.servo]
# 伺服控制参数 Servo Control Parameters
cmd = 0                              # 指令：0=停转,1=转动,2=寻位,3=归北
speed = 3                            # 转速（秒/转）
az = 0                               # 方位角（0.01度）

[params.scanrange]
# 扫描范围参数 Scan Range Parameters
workMode = 0                         # 工作模式：0=TWS,1=TAS

[params.beamcontrol]
# 波形控制参数 Beam Control Parameters
freqID = 4                           # 频率ID
type = 2                             # 类型
aziStart = -1500                     # 方位起始（0.01度）= -15°
aziEnd = 1500                        # 方位终止（0.01度）= 15°
aziStep = 400                        # 方位步进（0.01度）
pulseNum = 128                       # 积累脉冲数
flagNum = 2                          # 波形使能数量
beam1Flag = 1                        # 波形1使能
beam1Code = 6                        # 波形1编码
sampleStart1 = 0                     # 波形1采样起始
sampleEnd1 = 0                       # 波形1采样终止
elestart1 = 0                        # 波形1俯仰起始（0.01度）
eleend1 = 3000                       # 波形1俯仰终止（0.01度）
elestep1 = 400                       # 波形1俯仰步进（0.01度）
beam2Flag = 1                        # 波形2使能
beam2Code = 9                        # 波形2编码
sampleStart2 = 0                     # 波形2采样起始
sampleEnd2 = 0                       # 波形2采样终止
elestart2 = 0                        # 波形2俯仰起始（0.01度）
eleend2 = 1500                       # 波形2俯仰终止（0.01度）
elestep2 = 400                       # 波形2俯仰步进（0.01度）
beam3Flag = 0                        # 波形3使能
beam3Code = 11                       # 波形3编码
sampleStart3 = 0                     # 波形3采样起始
sampleEnd3 = 0                       # 波形3采样终止
elestart3 = 0                        # 波形3俯仰起始（0.01度）
eleend3 = 400                        # 波形3俯仰终止（0.01度）
elestep3 = 400                       # 波形3俯仰步进（0.01度）

[params.sigpro]
# 信号处理参数 Signal Processing Parameters
noise = 1000                         # 噪声门限
thresh1 = 0                          # 门限1
thresh2 = 0                          # 门限2
clutterThresh = 0                    # 杂波门限
clutterMapFlaseRate = 0              # 杂波图虚警率
CFARType = 0                         # CFAR类型
disProWin = 0                        # 距离保护窗
disRefWin = 0                        # 距离参考窗
dopProWin = 0                        # 多普勒保护窗
dopRefWin = 0                        # 多普勒参考窗
MTDWinType = 0                       # MTD窗类型
clutterMode = 0                      # 杂波模式
clutterChannelWidth = 0              # 杂波通道宽度
clutterUnitWin = 0                   # 杂波单元窗
clutterIter = 0                      # 杂波迭代
algorithmSwitch = 0                  # 算法开关

[params.datapro]
# 数据处理参数 Data Processing Parameters
startWinLen = 3                      # 起始窗长
startPoint = 0                       # 起始点
endWinLen = 0                        # 终止窗长
endPoint = 0                         # 终止点
noiseVar = 0                         # 噪声方差
trackDisLower = 0                    # 航迹距离下限
trackDisUpper = 0                    # 航迹距离上限
trackAziThresh = 0                   # 航迹方位门限
trackEleThresh = 0                   # 航迹俯仰门限
trackVelThresh = 0                   # 航迹速度门限
trackStatThresh = 0                  # 航迹统计门限
accuDisGate = 0                      # 累积距离门
accuAziGate = 0                      # 累积方位门
accuEleGate = 0                      # 累积俯仰门
accuVelGate = 0                      # 累积速度门

[params.datasave]
# 数据保存参数 Data Save Parameters
saveSwitch = 0                       # 保存开关
dataID = 0                           # 数据ID

# =============================================================================
# OSM道路数据配置 OSM Road Data Configuration
# =============================================================================

[osm]
# OSM道路数据文件（放在osm/目录下，仅文件名）
file = "bailuyuan.osm"
# 启用WGS84→GCJ-02坐标转换（中国地图瓦片必须开启，否则道路与地图有~300m偏移）
gcj02 = true
# 道路插值步长（米），在相邻OSM节点间均匀插入加密点，0=不插值
interpolation_step = 30

# =============================================================================
# 显示配置 Display Configuration
# =============================================================================

[displayConfig]
# 检测点显示配置 Detection Point Display Configuration
max_points = 1000                    # 最大检测点数量
iftbd = false                        # 是否启用TBD航迹接收与显示
ifxietong = false                    # 是否启用协同航迹接收与显示
