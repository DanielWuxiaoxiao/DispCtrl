# =============================================================================
# 网络通信配置 Network Communication Configuration
# =============================================================================

[network.ips]
# IP地址配置（与config.json保持一致）
DISP_CTRL_IP = "192.168.64.4"        # 显控主机IP地址
DATA_PRO_IP = "192.168.64.3"         # 数据处理主机IP地址
SIG_PRO_IP = "192.168.64.3"          # 信号处理主机IP地址
RES_DIS_IP = "192.168.64.3"          # 资源分配主机IP地址
PHOTO_ELE_IP = "192.168.101.10"      # 光电主机IP地址
MONITOR_IP = "192.168.64.3"          # 监控主机IP地址
DISP_CTRL_IP_FOR_PHOTO = "192.168.101.14"  # 显控对光电IP地址
GCS_LOCAL_IP = "192.168.144.66"      # 雷达平台GCS链路本机IP地址
GCS_IP = "192.168.144.77"            # GCS地面站IP地址

[network.ports]
# 端口配置（与config.json保持一致）
DISP_2_RES_PORT = 6012               # 显控->资源分配端口
RES_GET_DISP_PORT = 8012             # 资源分配接收显控端口
DISP_2_SIG_PORT = 6002               # 显控->信号处理端口
SIG_GET_DISP_PORT = 8002             # 信号处理接收显控端口
SIG_2_DISP_PORT1 = 6003              # 信号处理->显控端口1
SIG_2_DISP_PORT2 = 6004              # 信号处理->显控端口2
DISP_GET_SIG_PORT1 = 8003            # 显控接收信号端口1
DISP_GET_SIG_PORT2 = 8004            # 显控接收信号端口2
DATA_PRO_2_DISP = 6006               # 数据处理->显控：常规航迹发送端口（0xEE01）
DISP_GET_DATA_PORT = 8006            # 显控接收常规航迹端口（0xEE01）
DISP_2_DATA = 6008                   # 显控->数据处理端口
DATA_GET_DISP = 8008                 # 数据处理接收显控端口
DATA_PRO_2_DISP2 = 6010              # 数据处理->显控：TBD航迹发送端口（0xEE02）
DISP_GET_DATA_PORT2 = 8010           # 显控接收TBD航迹端口（0xEE02）
DATA_PRO_2_DISP3 = 6020              # 数据处理->显控：协同航迹发送端口（0xEE03）
DISP_GET_DATA_PORT3 = 8020           # 显控接收协同航迹端口（0xEE03）
TARGET_2_DISP = 6017                 # 目标分类->显控端口
DISP_GET_TARGET_PORT = 8017          # 显控接收目标端口
DISP_2_MONITOR = 6018                # 显控->监控端口
MONITOR_GET_DISP_PORT = 8018         # 监控接收显控端口
MONITOR_2_DISP = 6019                # 监控->显控端口
DISP_GET_MONITOR_PORT = 8019         # 显控接收监控端口
DISP_2_PHOTO_PORT = 10100            # 显控->光电端口
PHOTO_GET_DISP_PORT = 21001          # 光电接收显控端口
GCS_DST_PORT = 19801                 # GCS接收目标下发端口（雷达→GCS）
GCS_SRC_PORT = 19800                 # 本地雷达GCS链路端口

[network.ids]
# 系统ID配置（与config.json保持一致）
RES_DIS_ID = 47873                   # 资源分配系统ID
SIG_PRO_ID = 47874                   # 信号处理系统ID
DATA_PRO_ID = 47875                  # 数据处理系统ID
DISP_CTRL_ID = 47876                 # 显示控制系统ID
TAR_CLA_ID = 47877                   # 目标分类系统ID
MONITOR_ID = 47878                   # 监控系统ID

[network.gcs]
# Legacy GCS binary 0x52 track target report. Disabled by default.
target_report_enabled = false

[network.edge_radar_report]
# UDP JSON radar target/heartbeat report for edge-computing terminal.
enabled = false
target_ip = "192.168.1.100"
target_port = 9001
local_ip = "0.0.0.0"
local_port = 0
heartbeat_interval_ms = 5000
target_report_interval_ms = 4000
max_target_distance_m = 2000.0

[network.edge_radar_result]
# UDP JSON optical recognition result returned by edge-computing terminal.
enabled = true
local_ip = "0.0.0.0"
local_port = 9002

[network.total_control_mqtt]
# MQTT QoS0 report for local radar recognition + edge optical recognition.
enabled = false
host = "192.168.1.30"
port = 1883
client_id = "DispCtrl-X576"
topic = "x576/target/result"
keep_alive_sec = 30
publish_interval_ms = 4000

[ui]
# DPI policy:
# fixed  = do not follow Windows display/text scaling; preferred for fixed-layout display control UI
# system = follow system DPI scaling; fallback for high-DPI systems that require OS scaling
dpi_policy = "fixed"
# Internal UI scale applied on top of resolution layout. Supported range: 0.70-1.60.
ui_scale = 1.0

# =============================================================================
# 离线RAE点迹绘制 Offline RAE Dataset Drawing
# =============================================================================
[offline_rae]
enabled = false
# MATLAB脚本导出的RAE1二进制文件。路径相对软件运行目录，也可填写绝对路径。
adsb_file = "data/adsb_rae.bin"
compare_file = "data/compare_rae.bin"
clear_before_draw = true
max_records_per_click = 200000

# =============================================================================
# 雷达系统参数配置 Radar System Parameters Configuration
# =============================================================================

[radar]
# 雷达位置配置（基于index.html中的默认值）
longitude = 109.123922221                 # 雷达中心经度（西电99号楼）
latitude = 34.225249343                   # 雷达中心纬度（西电99号楼）
altitude = 781.48                     # 雷达海拔高度（米）
azimuth = 0.0                        # 阵面指北角（度）
pitch = 15.0                         # 俯仰角/倾角（度）
roll = 0.0                           # 横滚角（度）

[polarDisp.range]
# 极坐标显示距离范围配置（与config.json保持一致）
min = 0                              # 最小显示距离（千米）
max = 5                              # 最大显示距离（千米）

# =============================================================================
# 地图显示配置 Map Display Configuration
# =============================================================================

[map]
# 地图基本配置
engine = 1                           # 地图引擎：0=OSM(MapLibre+PMTiles,WGS84), 1=高德(AMap,GCJ-02)
default_type = 1                     # 默认地图类型（各引擎类型不同，详见下方说明）
# OSM引擎类型: 0=无地图, 1=路网图, 2=雷达暗绿, 3=暗色标准, 4=全要素
# 高德引擎类型: 0=无地图, 1=路网图, 2=标准图, 3=卫星图

# =============================================================================
# 扇形显示配置 Sector Display Configuration
# =============================================================================

[sectorDisp.angle]
# 扇形角度范围配置（单位：度）
min = -30                            # 默认最小角度
max = 30                             # 默认最大角度

[sectorDisp.range]
# 扇形距离范围配置（单位：公里）
min = 0                              # 默认最小距离
max = 5                              # 默认最大距离（与全局最大距离一致）

# =============================================================================
# 雷达扫描角度范围配置 Radar Scan Angle Range Configuration
# =============================================================================

[polarDisp.azimuthRange]
# 方位角范围配置（单位：度）
min = 30                             # 默认最小方位角
max = 120                            # 默认最大方位角

[polarDisp.elevationRange]
# 俯仰角范围配置（单位：度）
min = -10                            # 默认最小俯仰角
max = 45                             # 默认最大俯仰角

# =============================================================================
# 系统运行配置 System Runtime Configuration
# =============================================================================

[system]
# 系统运行参数
log_level = "INFO"                   # 日志级别：DEBUG/INFO/WARNING/ERROR
auto_save_interval = 300             # 自动保存间隔（秒）
enable_photoelectric_tx = false      # 是否启用显控->光电发送（临时不用时建议关闭）
enable_photoelectric_heartbeat = false # 是否启用光电心跳发送

[webengine]
# WebEngine调试配置
enable_debug = true                  # 是否启用WebEngine远程调试
debug_port = 9222                    # 调试端口

# ---- 渲染后端（解决黑屏/黑屏闪烁，按机器逐台调，无需重新编译）----
# 排障顺序：
#   1) gl_backend = "angle"  ← 默认推荐。ANGLE 走 Direct3D，Windows/双显卡(联想Y9000P等)最稳，且地图WebGL正常
#   2) 仍黑屏闪烁 → gl_backend = "desktop"（原生OpenGL，性能略好但双显卡上易闪）
#   3) 实在不行 → gl_backend = "software"（纯软件渲染，最兼容，但地图较慢）
# 注意：disable_gpu = true 会让在线/离线高德地图(基于WebGL)无法显示，本工程一般保持 false！
gl_backend = "angle"                 # 渲染后端：angle(默认,D3D,最稳) | desktop(原生OpenGL) | software(软件渲染)
disable_gpu = false                  # 一般保持false；true=关WebEngine GPU(会导致WebGL地图空白，慎用)
extra_chromium_flags = ""            # 追加自定义Chromium参数(空格分隔),高级调优用,一般留空

# =============================================================================
# 激光侦察上报（独立模块）Laser Reconnaissance Report
# 仅“激光终端”功能：右键航迹→引导光电跟踪(持续)，对该目标周期发送侦察帧。
# enabled=false 时不创建模块、右键菜单也不出现该项；与其它上报/下发互不影响。
# =============================================================================
[laser]
enabled = false                      # 激光上报总开关（关闭时右键无此项）
radar_ip = "192.168.101.9"           # 雷达端本地绑定IP（9009发送源端）
laser_ctrl_ip = "192.168.101.10"     # 激光控制终端IP
udp_port = 9009                      # 雷达192.168.101.9:9009 → 激光192.168.101.10:9009
report_interval_ms = 1000            # 持续上报周期(ms)
save_txt = true                      # 是否把每次“下发新目标”的信息保存到本地txt
save_dir = "LaserReportLog"          # txt保存目录（相对程序运行目录）

# =============================================================================
# 健康管理网络状态 Network Health
# radar_peer_ip 必须填写X576现场阵面对端IP；不能误用DATA_PRO_IP等处理软件地址。
# 本机阵面IP未单独配置时继承network.ips.DISP_CTRL_IP；激光IP/对端则继承[laser]配置。
# =============================================================================
[health_network]
enabled = true
poll_interval_ms = 5000
# radar_local_ip = "192.168.64.4"   # 可选：仅当阵面网卡IP与DISP_CTRL_IP不同才覆盖
radar_peer_ip = ""                  # 现场填写阵面对端IP，例如 "192.168.64.x"

# =============================================================================
# 总控通信 Command-control UDP Protocol
# 本模块自行剥离被错误嵌套的引号，并对端口/数值作范围校验，以规避历史 TOML
# 字符串引号解析问题。变更配置后重启生效。
# =============================================================================
[command_control]
# 是否启用总控 UDP 通信模块；false 时不创建组播、单播、记录和控制窗口。
enabled = true
# 雷达/显控端本机 IPv4；用于绑定 UDP 套接字及写入 DD33 登录请求，需与总控同网段可达。
local_ip = "192.30.105.13"
# 本机 UDP 绑定端口；DD33 中同时上报该端口，合法范围 1～65535。
local_port = 21505
# DD25、DDA1、DDA4 和 DD31 使用的 IPv4 组播地址。
multicast_group = "224.0.1.2"
# 组播收发端口；应与总控和其它设备配置一致，合法范围 1～65535。
multicast_port = 21505
# 期望总控来源 IP；仅用于收到 DD31 时的告警核对，不会阻止有效 DD31 更新实际单播端点。
expected_control_ip = "192.30.105.10"
# 本机雷达/显控端用户 ID；写入公共报头、DD33、DDA4，必须非 0，支持十进制或 0x 十六进制。
device_id = "0x11474202"
# DDA4 自动上报开关；true 时识别为无人机的普通航迹自动组播，窗口可在本次运行中切换。
auto_report_enabled = true
# DD25 链路检测组播周期，单位毫秒；建议保持 3000，5 个周期未收到对端 DD25 判定其离线。
link_interval_ms = 3000
# DDA1 雷达装备状态组播周期，单位毫秒；建议保持 3000。
equipment_status_interval_ms = 3000
# DD33 登录未收到 DD34 回复时的额外重发次数；0 表示不重发，最大 10。
login_retry_count = 3
# DD33 登录自动重发间隔，单位毫秒；合法范围 250～60000。
login_retry_interval_ms = 1000
# 是否为本机上报和组播接收的每条 DDA4 创建 JSONL 会话记录；关闭后回放读取功能也关闭。
record_enabled = true
# JSONL 会话记录目录；相对路径以程序当前工作目录为基准，每次启动创建一个新文件。
record_directory = "CommandControlRecords"
# 回放 DDA4 到 PPI 的投递周期，单位毫秒；数值越小回放越快，合法范围 10～10000。
replay_interval_ms = 200
# 控制窗口内存中最多展示的 DDA4 条数；只限制界面缓存，不影响 JSONL 完整落盘，范围 10～10000。
visible_record_limit = 1000

# DD25 协同参与状态字段；当前协议默认 0x00，范围 0～255。
dd25_cooperation_status = 0

# DDA4 目标综合批号；当前协议默认 0，范围 0～4294967295。
dda4_comprehensive_batch = 0
# DDA4 设备类型；当前默认 2，范围 0～255。
dda4_device_type = 2
# DDA4 同类型设备编号；当前默认 1，范围 0～255。
dda4_device_number = 1
# DDA4 数据率编码，单位 0.01Hz；200 表示 2Hz，范围 0～65535。
dda4_rate_centi_hz = 200
# DDA4 目标属性字节；当前默认 0x00，范围 0～255。
dda4_target_attribute = 0
# DDA4 目标类型字节；当前默认 0x00，范围 0～255。
dda4_target_type = 0
# DDA4 航迹质量字节；当前默认 0xFF（十进制 255），范围 0～255。
dda4_track_quality = 255
# DDA4 RCS 默认编码，单位 0.001 平方米；无 RCS 数据时填该值，当前为 0。
dda4_rcs_milli_square_m = 0
# DDA4 干扰状态字节；当前默认 0x00，范围 0～255。
dda4_interference_status = 0
# DDA4 更新方式高半字节：普通航迹 statMethod=1（外推）时使用，范围 0～15。
dda4_update_state_extrapolated = 1
# DDA4 更新方式高半字节：普通航迹 statMethod 非 1（更新滤波）时使用，范围 0～15。
dda4_update_state_filtered = 2
# DDA4 更新方式低半字节：自动上报使用，范围 0～15。
dda4_update_mode_auto = 1
# DDA4 更新方式低半字节：手动上报使用，范围 0～15。
dda4_update_mode_manual = 2
# DDA4 相对延时，单位毫秒；当前默认 0，范围 0～65535。
dda4_relative_delay_ms = 0

# DDA1 工作状态字节；低 4 位 1 表示战斗，当前默认 0x01，范围 0～255。
dda1_work_status = 1
# DDA1 健康状态字节；0x03 表示正常，当前默认 3，范围 0～255。
dda1_health_status = 3
# DDA1 本报文携带的设备数量；当前实现仅上报一个搜索雷达，默认 1。
dda1_device_count = 1
# DDA1 搜索雷达设备类型；定版值为 0x02，TOML 使用十进制 2，范围 0～255。
dda1_device_type = 2
# DDA1 搜索雷达设备编号；当前默认 1，范围 0～255。
dda1_device_number = 1
# DDA1 搜索雷达设备状态；0x03 表示正常，当前默认 3，范围 0～255。
dda1_device_status = 3
# DDA1 搜索雷达工作模式；0x22 表示常规，TOML 使用十进制 34，范围 0～255。
dda1_work_mode = 34
# DDA1 方位范围起始角，单位度；正北为 0，范围 0～360。
dda1_azimuth_start_deg = 0
# DDA1 方位范围终止角，单位度；正北为 0，范围 0～360。
dda1_azimuth_end_deg = 360
# DDA1 俯仰范围起始角，单位度；水平为 0，范围 -10～70。
dda1_elevation_start_deg = -10
# DDA1 俯仰范围终止角，单位度；水平为 0，范围 -10～70。
dda1_elevation_end_deg = 70
# DDA1 对应的阵面 ID；仅接收该 ID 的 BIT 偏航角，取值 0～3，默认阵面 0。
dda1_radar_id = 0
# DDA1 初始辐射状态；0 表示关、1 表示开；运行期间会跟随显控发射开关更新。
radiation_status = 0
# DDA4 摘要写入项目日志的周期，单位毫秒；0 表示每条均写日志。完整逐条原始报文始终写入 JSONL。
dda4_log_interval_ms = 1000
# 是否额外输出所有已接收/已投递发送报文的十六进制字节；仅在字节级联调时开启，高频 DDA4 会产生大量日志。
packet_hex_log_enabled = false

