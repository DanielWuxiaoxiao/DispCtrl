<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="initial-scale=1.0, user-scalable=no, width=device-width" />
  <!-- <link
      rel="stylesheet"
      href="https://cache.amap.com/lbs/static/main1119.css"
    /> -->
  <!-- <script
      type="text/javascript"
      src="https://webapi.amap.com/maps?v=2.0&key=7eaa30d7af3c6819066212a8a0fdffda"
    ></script> -->
  <script src="./amap/AMap3.js"></script>
  <style>
    /* 设置地图容器的大小 否则地图容器大小为0*/
    #container {
      width: 100%;
      height: 100vh;
      /* 使容器占满整个视口 */
      margin: 0;
      padding: 0;
      /* 注意：影像瓦片是 WebGL 画布，CSS filter 在 ANGLE(D3D) 后端下不会覆盖它，
         故军工绿改为下方 #mapMask 叠加层（跨显卡/系统一致）。 */
    }
    /* 军工绿蒙版（卫星影像版）：影像本身已很丰富，用较淡的绿色叠加，保留地物细节。
       调色只改这一处 background：想更绿/更暗→提高 alpha；想更清晰→降低 alpha。 */
    #mapMask {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 9999;
      background: rgba(12, 70, 36, 0.30); /* 卫星影像军工绿蒙版，较淡，可调 */
    }

    html,
    body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: transparent;
      /* 背景透明 */
    }
  </style>
</head>

<body>
  <div id="container"></div>
  <div id="mapMask"></div>
  <script src="qwebchannel.js"></script>
  <script type="text/javascript">
    // var map = new AMap.Map("container", {
    //   resizeEnable: true,
    //   zoom: 15, //初始化地图层级
    //   center: [108.9138, 34.2311], //初始化地图中心点
    //   mapStyle: "amap://styles/normal", //地图风格
    //   //viewMode: "3D", //三维视图,需要拖动才能变成3d
    // });

    //离线地图 - 优先从URL参数读取初始中心（Qt切换地图时传入），无参数则用默认值
    var _qp = new URLSearchParams(window.location.search);
    var initLng = parseFloat(_qp.get('lng')) || 108.9138;
    var initLat = parseFloat(_qp.get('lat')) || 34.2311;
    var initRange = parseFloat(_qp.get('range')) || 3.0; //km
    var initOffX = parseFloat(_qp.get('offx')) || 0; // PPI水平偏移比例
    var initOffY = parseFloat(_qp.get('offy')) || 0; // PPI垂直偏移比例
    var map = new AMap.Map("container", {
      resizeEnable: true,
      animateEnable: false, // 关闭地图平移/缩放动画，改量程时瞬间到位，避免动画期间漂移
      //rotateEnable: true,  //旋转后汉字也会旋转
      center: [initLng, initLat], // 中心点，西电99号楼
      zoom: 15.3, //
      layers: [
        new AMap.TileLayer({
          tileUrl: "./map16S/[z]/[x]/[y]/tile.png", // 本地瓦片路径，使用[]而不是{},amap3.js是处理的[]的瓦片替代
          zooms: [1, 16], //注意范围必须大于等于 zoom，瓦片范围为1-16
          //mapStyle: "amap://styles/dark", //地图风格在离线地图情况下无法使用
        }),
      ],
    });

    const earthRadius = 6378.137; // 地球半径，单位为公里

    var mchannel; //注册qt通信通道
    window.onload = function () {
      if (typeof qt != "undefined") {
        //注册qtchannel
        new QWebChannel(qt.webChannelTransport, function (channel) {
          channel.objects.qtChannel.centerOn.connect(setCenterOn);
          channel.objects.qtChannel.changeGrayScale.connect(setGrayscale);
          mchannel = channel;
        });
      } else {
        alert("qt对象获取失败！");
      }
    };

    const PI = 3.14159265358979324;
    const A = 6378245.0;
    const EE = 0.00669342162296594323;

    function outOfChina(lng, lat) {
      return (
        lng < 72.004 ||
        lng > 137.8347 ||
        lat < 0.8293 ||
        lat > 55.8271
      );
    }

    function transformLat(x, y) {
      let ret =
        -100.0 +
        2.0 * x +
        3.0 * y +
        0.2 * y * y +
        0.1 * x * y +
        0.2 * Math.sqrt(Math.abs(x));

      ret +=
        (20.0 * Math.sin(6.0 * x * PI) +
          20.0 * Math.sin(2.0 * x * PI)) *
        2.0 /
        3.0;

      ret +=
        (20.0 * Math.sin(y * PI) +
          40.0 * Math.sin(y / 3.0 * PI)) *
        2.0 /
        3.0;

      ret +=
        (160.0 * Math.sin(y / 12.0 * PI) +
          320 * Math.sin(y * PI / 30.0)) *
        2.0 /
        3.0;

      return ret;
    }

    function transformLon(x, y) {
      let ret =
        300.0 +
        x +
        2.0 * y +
        0.1 * x * x +
        0.1 * x * y +
        0.1 * Math.sqrt(Math.abs(x));

      ret +=
        (20.0 * Math.sin(6.0 * x * PI) +
          20.0 * Math.sin(2.0 * x * PI)) *
        2.0 /
        3.0;

      ret +=
        (20.0 * Math.sin(x * PI) +
          40.0 * Math.sin(x / 3.0 * PI)) *
        2.0 /
        3.0;

      ret +=
        (150.0 * Math.sin(x / 12.0 * PI) +
          300.0 * Math.sin(x / 30.0 * PI)) *
        2.0 /
        3.0;

      return ret;
    }

    function wgs84ToGcj02(lng, lat) {
      if (outOfChina(lng, lat)) {
        return [lng, lat];
      }

      let dLat = transformLat(lng - 105.0, lat - 35.0);
      let dLng = transformLon(lng - 105.0, lat - 35.0);

      const radLat = lat / 180.0 * PI;

      let magic = Math.sin(radLat);
      magic = 1 - EE * magic * magic;

      const sqrtMagic = Math.sqrt(magic);

      dLat =
        (dLat * 180.0) /
        ((A * (1 - EE)) /
          (magic * sqrtMagic) *
          PI);

      dLng =
        (dLng * 180.0) /
        (A / sqrtMagic *
          Math.cos(radLat) *
          PI);

      return [
        lng + dLng,
        lat + dLat
      ];
    }

    //直接设置地图的中心和距离（含 WGS84→GCJ02 转换 + PPI 像素偏移补偿）
    function setCenterOn(centerLng, centerLat, range, offsetRatioX, offsetRatioY) {
      offsetRatioX = offsetRatioX || 0;
      offsetRatioY = offsetRatioY || 0;

      // 1) 雷达原始 WGS84 → GCJ02（与离线瓦片坐标系一致）
      const gcj = wgs84ToGcj02(centerLng, centerLat);
      const gLng = gcj[0];
      const gLat = gcj[1];

      // 高精度地球常数
      const EARTH_RADIUS_M = 6378137.0; // WGS84椭球体长半轴，米
      const DEG_TO_RAD = Math.PI / 180.0;
      const RAD_TO_DEG = 180.0 / Math.PI;

      // 容器实际像素尺寸（CSS px，与 Qt 逻辑像素同比例，DPI/分辨率已在 Qt 侧抵消）
      const container = document.getElementById("container");
      const containerWidth = container.clientWidth;
      const containerHeight = container.clientHeight;
      const actualAspectRatio = containerWidth / containerHeight;

      // 2) 用地图自身比例还原 PPI 中心相对地图中心的像素偏移
      //    横屏时 mppMap 与 PPI metersPerPixel 严格相等，保证距离环与地图比例对齐
      const mppMap = (range * 1000.0) / containerWidth; // 米/像素
      const offPxX = offsetRatioX * containerWidth;      // CSS 像素
      const offPxY = offsetRatioY * containerHeight;
      const meterX = offPxX * mppMap;
      const meterY = offPxY * mppMap;

      // 3) 像素偏移 → 经纬度偏移，反推地图中心，使雷达(GCJ02)落到 PPI 中心像素
      const gLatRad = gLat * DEG_TO_RAD;
      const lngOff = meterX / (EARTH_RADIUS_M * Math.cos(gLatRad) * DEG_TO_RAD);
      const latOff = meterY / (EARTH_RADIUS_M * DEG_TO_RAD);
      const mapCenterLng = gLng - lngOff; // 屏幕X右为正、经度东为正
      const mapCenterLat = gLat + latOff; // 屏幕Y下为正、纬度北为正（故加）

      // 4) 按显示范围构造对称边界并 setBounds
      const horizontalRangeM = range * 1000.0;
      const verticalRangeM = (range / actualAspectRatio) * 1000.0;
      const centerLatRad = mapCenterLat * DEG_TO_RAD;
      const latDiff = ((verticalRangeM / 2.0) / EARTH_RADIUS_M) * RAD_TO_DEG;
      const lngDiff = ((horizontalRangeM / 2.0) / (EARTH_RADIUS_M * Math.cos(centerLatRad))) * RAD_TO_DEG;

      const southWestLng = mapCenterLng - lngDiff;
      const southWestLat = mapCenterLat - latDiff;
      const northEastLng = mapCenterLng + lngDiff;
      const northEastLat = mapCenterLat + latDiff;

      console.log(`setCenterOn raw(${centerLng}, ${centerLat}) -> gcj(${gLng.toFixed(8)}, ${gLat.toFixed(8)}), range=${range}km, offsetRatio(${offsetRatioX.toFixed(4)}, ${offsetRatioY.toFixed(4)})`);
      console.log(`pixel offset(${offPxX.toFixed(1)}, ${offPxY.toFixed(1)})px, meter offset(${meterX.toFixed(1)}, ${meterY.toFixed(1)})m, mapCenter(${mapCenterLng.toFixed(8)}, ${mapCenterLat.toFixed(8)})`);

      var bounds = new AMap.Bounds(
        [southWestLng, southWestLat], // 西南角坐标
        [northEastLng, northEastLat] // 东北角坐标
      );
      // 设置地图显示的边界范围
      map.setBounds(bounds);
    }
    //如果再setcenter后立即执行getcenter函数会导致setcenter实际没有完全更新地图，这个时候获得的center并不是最终center
    setCenterOn(initLng, initLat, initRange, initOffX, initOffY);

    function setGrayscale(value) {
      var container = document.getElementById("container");
      container.style.filter = `grayscale(${value}%)`;
    }
  </script>
</body>

</html>
